[project]
name = "afterglow-ml"
version = "0.0.0"
description = "Doodle recognition for Afterglow: Quick, Draw! data prep, training, evaluation, and ONNX export."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["mypy==2.3.1", "pytest==9.1.1", "ruff==0.16.9"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
